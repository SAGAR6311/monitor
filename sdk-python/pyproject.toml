[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-sdk"
version = "1.0.0"
description = "Error reporting for your Monitor server: Python and Django"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
py-modules = ["monitor_sdk"]
